name: toreta-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: toreta-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: toreta-state-${{ github.run_id }}
          restore-keys: toreta-state-

      - name: Check availability
        env:
          TORETA_SLUG: bistroshin3
          TARGET_DATES: ${{ vars.TARGET_DATES }}
          SEATS: ${{ vars.SEATS }}
          TIME_FROM: ${{ vars.TIME_FROM }}
          TIME_TO: ${{ vars.TIME_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          LOOP_COUNT: "55"
          INTERVAL_SEC: "60"
        run: python3 monitor.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: toreta-state-${{ github.run_id }}
